<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARBOUND: ELITE EQUESTRIAN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #f0f0f0;
            overflow: hidden;
            position: relative;
        }

        .app-container {
            max-width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(90deg, #0f3460 0%, #16213e 50%, #0f3460 100%);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid #d4af37;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            letter-spacing: 2px;
        }

        .currency-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .currency-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .currency-value {
            color: #d4af37;
            font-weight: bold;
        }

        nav {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 52, 96, 0.8);
            padding: 10px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #f0f0f0;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            border-radius: 5px;
        }

        .nav-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            color: #d4af37;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #d4af37, #f4d03f);
            color: #0f3460;
            font-weight: bold;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .screen {
            display: none;
            animation: fadeIn 0.3s;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: linear-gradient(135deg, rgba(15, 52, 96, 0.8), rgba(22, 33, 62, 0.9));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.2);
        }

        .horse-card {
            display: flex;
            gap: 15px;
            cursor: pointer;
            position: relative;
        }

        .horse-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #d4af37, #f4d03f);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            flex-shrink: 0;
        }

        .horse-info {
            flex: 1;
        }

        .horse-name {
            font-size: 1.2rem;
            color: #d4af37;
            margin-bottom: 5px;
        }

        .horse-breed {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .stat-bar {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            height: 8px;
            margin: 5px 0;
            overflow: hidden;
            position: relative;
        }

        .stat-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
            background: linear-gradient(90deg, #4a90e2, #63b3ed);
        }

        .stat-label {
            font-size: 0.8rem;
            color: #ccc;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
        }

        .btn {
            background: linear-gradient(135deg, #d4af37, #f4d03f);
            border: none;
            color: #0f3460;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4a90e2, #63b3ed);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.3);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #d4af37;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .summon-reveal {
            text-align: center;
            padding: 20px;
        }

        .summon-animation {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            background: linear-gradient(135deg, #d4af37, #f4d03f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
            50% { transform: scale(1.1); box-shadow: 0 0 40px rgba(212, 175, 55, 0.8); }
        }

        .rarity-legendary {
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .rarity-elite {
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        .rarity-rare {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .world-map {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .region-card {
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.3), rgba(99, 179, 237, 0.3));
            border: 2px solid rgba(212, 175, 55, 0.5);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .region-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .region-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quest-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #d4af37;
        }

        .progress-bar {
            background: rgba(0, 0, 0, 0.3);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #f4d03f);
            transition: width 0.5s;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 5px;
        }

        .badge-legendary { background: #ff6b6b; color: white; }
        .badge-elite { background: #a855f7; color: white; }
        .badge-rare { background: #3b82f6; color: white; }
        .badge-uncommon { background: #10b981; color: white; }
        .badge-common { background: #6b7280; color: white; }

        .shimmer {
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .welcome-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-screen h2 {
            color: #d4af37;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .welcome-screen input {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #d4af37;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            margin: 20px 0;
            width: 100%;
            max-width: 300px;
        }

        .starter-horses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .starter-horse {
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.3), rgba(99, 179, 237, 0.3));
            border: 2px solid rgba(212, 175, 55, 0.5);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .starter-horse:hover {
            transform: scale(1.05);
            border-color: #d4af37;
        }

        .starter-horse.selected {
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 999;
        }

        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            background: linear-gradient(135deg, #d4af37, #f4d03f);
            color: #0f3460;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5);
            z-index: 2000;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .select-dropdown {
            width: 100%;
            padding: 10px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            margin: 10px 0;
        }

        .compatibility-meter {
            background: rgba(0, 0, 0, 0.3);
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .compatibility-fill {
            height: 100%;
            background: linear-gradient(90deg, #e74c3c, #f39c12, #2ecc71);
            transition: width 0.5s;
        }

        .dragon-card {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(139, 92, 246, 0.3));
            border: 2px solid #a855f7;
        }

        .energy-bar {
            background: rgba(0, 0, 0, 0.3);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #a855f7);
            transition: width 0.5s;
        }

        .tab-content {
            margin-top: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #f0f0f0;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #d4af37, #f4d03f);
            color: #0f3460;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="app-container">
        <header>
            <h1>⭐ STARBOUND: ELITE EQUESTRIAN ⭐</h1>
            <div class="currency-bar" id="currencyBar"></div>
        </header>
        <nav id="mainNav" style="display: none;">
            <button class="nav-btn" onclick="switchScreen('home')">Home</button>
            <button class="nav-btn" onclick="switchScreen('stable')">Stable</button>
            <button class="nav-btn" onclick="switchScreen('compete')">Compete</button>
            <button class="nav-btn" onclick="switchScreen('ranch')">Ranch</button>
            <button class="nav-btn" onclick="switchScreen('summon')">Summon</button>
            <button class="nav-btn" onclick="switchScreen('quests')">Quests</button>
            <button class="nav-btn" onclick="switchScreen('world')">World Map</button>
        </nav>
        <main id="mainContent"></main>
    </div>

    <script>
        // ============= GAME STATE =============
        const gameState = {
            player: {
                name: '',
                prestigePoints: 0,
                unlockedRegions: [1],
                coins: 1000,
                gems: 50,
                spiritTokens: 0,
                dragonEssences: 0
            },
            horses: [],
            dragons: [],
            ranch: {
                facilities: {
                    stable: { level: 1, capacity: 10 },
                    trainingRing: { level: 0, bonus: 0 },
                    indoorArena: { level: 0 },
                    pasture: { level: 0, injuryReduction: 0 },
                    dragonRoost: { level: 0, energyRegen: 0 }
                },
                decor: []
            },
            quests: {
                daily: [],
                weekly: [],
                story: [],
                mythic: [],
                celestial: []
            },
            summonPity: {
                standard: 0,
                champion: 0,
                seasonal: 0,
                skybound: 0,
                elderRelics: 0,
                celestial: 0
            },
            competitions: {
                seasonStart: Date.now(),
                rank: 'Bronze',
                points: 0
            },
            lastSave: Date.now(),
            gameStarted: false
        };

        // ============= DATA DEFINITIONS =============
        const BREEDS = {
            Warmblood: { 
                region: 1, 
                baseStats: { speed: 50, stamina: 50, precision: 50, power: 50, temperament: 50, recovery: 50 },
                coats: ['Bay', 'Chestnut', 'Black', 'Grey', 'Palomino', 'Dapple Grey']
            },
            Thoroughbred: { 
                region: 2, 
                baseStats: { speed: 70, stamina: 40, precision: 50, power: 45, temperament: 40, recovery: 45 },
                coats: ['Bay', 'Chestnut', 'Black', 'Grey', 'Roan', 'Dark Bay']
            },
            'Friesian Sport': { 
                region: 3, 
                baseStats: { speed: 45, stamina: 50, precision: 70, power: 50, temperament: 60, recovery: 50 },
                coats: ['Black', 'Dark Brown', 'Jet Black', 'Smoky Black']
            },
            'Highland Warmblood': { 
                region: 4, 
                baseStats: { speed: 50, stamina: 55, precision: 50, power: 70, temperament: 50, recovery: 60 },
                coats: ['Bay', 'Liver Chestnut', 'Black', 'Dun', 'Buckskin']
            },
            'Celestial Line': { 
                region: 5, 
                baseStats: { speed: 80, stamina: 80, precision: 80, power: 80, temperament: 80, recovery: 80 },
                coats: ['Starlight', 'Moonbeam', 'Solar Flare', 'Nebula', 'Aurora']
            }
        };

        const REGIONS = [
            { id: 1, name: 'Meadow Circuit', unlockCost: 0, description: 'Starter region for fundamentals' },
            { id: 2, name: 'Timber Ridge', unlockCost: 100, description: 'Test your endurance' },
            { id: 3, name: 'Coastline Arena', unlockCost: 300, description: 'Precision challenges' },
            { id: 4, name: 'Highland Trials', unlockCost: 750, description: 'Elite competitions' },
            { id: 5, name: 'Celestial Grounds', unlockCost: 2000, description: 'Endgame content' }
        ];

        const DRAGON_TYPES = {
            Storm: { stats: { speed: 10, power: 10 }, color: '#4a90e2' },
            Frost: { stats: { stamina: 10, recovery: 10 }, color: '#63b3ed' },
            Ember: { stats: { power: 10, speed: 8 }, color: '#e74c3c' },
            Solar: { stats: { precision: 10, temperament: 8 }, color: '#f39c12' },
            Lunar: { stats: { speed: 5, stamina: 5, precision: 5, power: 5, temperament: 5, recovery: 5 }, color: '#a855f7' }
        };

        // ============= UTILITY FUNCTIONS =============
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateId() {
            return Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function showNotification(message) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        function updateCurrencyBar() {
            document.getElementById('currencyBar').innerHTML = `
                <div class="currency-item">💰 <span class="currency-value">${gameState.player.coins.toLocaleString()}</span> Coins</div>
                <div class="currency-item">💎 <span class="currency-value">${gameState.player.gems.toLocaleString()}</span> Gems</div>
                <div class="currency-item">✨ <span class="currency-value">${gameState.player.spiritTokens}</span> Spirit Tokens</div>
                <div class="currency-item">🐉 <span class="currency-value">${gameState.player.dragonEssences}</span> Dragon Essences</div>
                <div class="currency-item">🏆 <span class="currency-value">${gameState.player.prestigePoints}</span> Prestige</div>
            `;
        }

        // ============= HORSE FUNCTIONS =============
        function createHorse(breed, level = 1, rarity = 'common') {
            const breedData = BREEDS[breed];
            const coats = breedData.coats;
            const isShimmer = Math.random() < 0.01;
            const coat = isShimmer ? coats[randomInt(0, coats.length - 1)] + ' Shimmer' : coats[randomInt(0, coats.length - 1)];
            
            const stats = {};
            for (let stat in breedData.baseStats) {
                const variance = randomInt(-5, 5);
                stats[stat] = breedData.baseStats[stat] + variance + (level - 1) * 2;
            }

            return {
                id: generateId(),
                breed,
                name: generateHorseName(),
                coat,
                level,
                xp: 0,
                rarity,
                stats,
                isShimmer,
                isPegasus: false,
                isWinged: false,
                injuries: 0,
                training: []
            };
        }

        function generateHorseName() {
            const prefixes = ['Star', 'Shadow', 'Thunder', 'Mystic', 'Golden', 'Silver', 'Midnight', 'Dawn', 'Storm', 'Ember'];
            const suffixes = ['Runner', 'Spirit', 'Dancer', 'Fire', 'Wind', 'Dream', 'Pride', 'Grace', 'Glory', 'Legend'];
            return prefixes[randomInt(0, prefixes.length - 1)] + ' ' + suffixes[randomInt(0, suffixes.length - 1)];
        }

        function trainHorse(horseId, stat) {
            const horse = gameState.horses.find(h => h.id === horseId);
            if (!horse) return;

            const cost = 50 * horse.level;
            if (gameState.player.coins < cost) {
                showNotification('Not enough coins!');
                return;
            }

            gameState.player.coins -= cost;
            horse.stats[stat] += randomInt(1, 3);
            horse.xp += 10;

            if (horse.xp >= horse.level * 100) {
                horse.level++;
                horse.xp = 0;
                showNotification(`${horse.name} leveled up to ${horse.level}!`);
            }

            horse.training.push(stat);
            showNotification(`${horse.name} trained in ${stat}!`);
            updateCurrencyBar();
            saveGame();
        }

        function breedHorses(parent1Id, parent2Id) {
            const p1 = gameState.horses.find(h => h.id === parent1Id);
            const p2 = gameState.horses.find(h => h.id === parent2Id);
            
            if (!p1 || !p2) return;

            const cost = 200;
            if (gameState.player.coins < cost) {
                showNotification('Not enough coins for breeding!');
                return;
            }

            // Calculate compatibility
            let compatibility = 50;
            if (p1.breed === p2.breed) compatibility += 10;
            const sharedTraining = p1.training.filter(t => p2.training.includes(t)).length;
            compatibility += Math.min(sharedTraining * 5, 15);

            gameState.player.coins -= cost;

            const child = createHorse(p1.breed, 1, 'common');
            
            // Inherit stats
            for (let stat in child.stats) {
                const avg = (p1.stats[stat] + p2.stats[stat]) / 2;
                const mutation = Math.random() < 0.07 ? randomInt(5, 10) : 0;
                child.stats[stat] = Math.floor(avg + mutation + (compatibility / 10));
            }

            // Rare coat mutation
            if (Math.random() < 0.01 * (compatibility / 50)) {
                child.coat = 'Rainbow Shimmer';
                child.isShimmer = true;
                child.rarity = 'elite';
            }

            child.name = generateHorseName();
            gameState.horses.push(child);
            
            showNotification(`Bred new horse: ${child.name}! (Compatibility: ${compatibility}%)`);
            updateCurrencyBar();
            saveGame();
            renderStable();
        }

        function ascendToPegasus(horseId) {
            const horse = gameState.horses.find(h => h.id === horseId);
            if (!horse || horse.level < 50 || horse.isPegasus || horse.isWinged) {
                showNotification('Cannot ascend this horse!');
                return;
            }

            const cost = 1000;
            if (gameState.player.coins < cost) {
                showNotification('Not enough coins!');
                return;
            }

            gameState.player.coins -= cost;
            horse.isPegasus = true;
            horse.stats.stamina = Math.floor(horse.stats.stamina * 1.05);
            
            showNotification(`${horse.name} ascended to Pegasus!`);
            updateCurrencyBar();
            saveGame();
            renderStable();
        }

        // ============= SUMMON SYSTEM =============
        function performSummon(banner) {
            let cost, currency;
            switch(banner) {
                case 'standard':
                    cost = 100;
                    currency = 'coins';
                    break;
                case 'champion':
                    cost = 10;
                    currency = 'gems';
                    break;
                case 'skybound':
                    cost = 20;
                    currency = 'gems';
                    break;
                case 'elderRelics':
                    cost = 15;
                    currency = 'gems';
                    break;
                default:
                    return;
            }

            if (gameState.player[currency] < cost) {
                showNotification(`Not enough ${currency}!`);
                return;
            }

            gameState.player[currency] -= cost;
            gameState.summonPity[banner]++;

            let result;
            if (banner === 'elderRelics') {
                result = summonDragon(banner);
            } else {
                result = summonHorse(banner);
            }

            showSummonReveal(result);
            updateCurrencyBar();
            saveGame();
        }

        function summonHorse(banner) {
            let rarity = 'common';
            let breed = 'Warmblood';
            const pity = gameState.summonPity[banner];

            // Pity system
            if (pity >= 75) {
                rarity = 'legendary';
                gameState.summonPity[banner] = 0;
            } else if (pity >= 20) {
                rarity = 'elite';
                gameState.summonPity[banner] = 0;
            } else {
                const roll = Math.random();
                if (roll < 0.01) rarity = 'legendary';
                else if (roll < 0.05) rarity = 'elite';
                else if (roll < 0.15) rarity = 'rare';
                else if (roll < 0.35) rarity = 'uncommon';
            }

            // Winged horse chance for skybound
            const isWinged = banner === 'skybound' && Math.random() < 0.01;

            // Select breed based on unlocked regions
            const availableBreeds = Object.keys(BREEDS).filter(b => 
                gameState.player.unlockedRegions.includes(BREEDS[b].region)
            );
            breed = availableBreeds[randomInt(0, availableBreeds.length - 1)];

            const horse = createHorse(breed, 1, rarity);
            if (isWinged) {
                horse.isWinged = true;
                horse.name = 'Winged ' + horse.name;
            }

            // Check for duplicate
            const duplicate = gameState.horses.find(h => 
                h.breed === horse.breed && h.coat === horse.coat && !h.isShimmer && !horse.isShimmer
            );

            if (duplicate && !horse.isShimmer) {
                gameState.player.spiritTokens += rarityToTokens(rarity);
                return { type: 'duplicate', horse, tokens: rarityToTokens(rarity) };
            }

            gameState.horses.push(horse);
            return { type: 'horse', horse };
        }

        function summonDragon(banner) {
            const pity = gameState.summonPity[banner];
            let tier = 'Shard';

            if (pity >= 120) {
                tier = 'Elder';
                gameState.summonPity[banner] = 0;
            } else if (pity >= 25) {
                tier = 'Young';
                gameState.summonPity[banner] = 0;
            } else {
                const roll = Math.random();
                if (roll < 0.005) tier = 'Elder';
                else if (roll < 0.02) tier = 'Ancient';
                else if (roll < 0.1) tier = 'Young';
            }

            const types = Object.keys(DRAGON_TYPES);
            const type = types[randomInt(0, types.length - 1)];

            const dragon = {
                id: generateId(),
                type,
                tier,
                level: 1,
                energy: 100,
                maxEnergy: 100
            };

            gameState.dragons.push(dragon);
            return { type: 'dragon', dragon };
        }

        function rarityToTokens(rarity) {
            const map = { common: 1, uncommon: 2, rare: 5, elite: 10, legendary: 25 };
            return map[rarity] || 1;
        }

        // ============= COMPETITION SYSTEM =============
        function compete(horseId, mode) {
            const horse = gameState.horses.find(h => h.id === horseId);
            if (!horse) return;

            const cost = 50;
            if (gameState.player.coins < cost) {
                showNotification('Not enough coins to compete!');
                return;
            }

            gameState.player.coins -= cost;

            // Calculate score based on mode
            let score = 0;
            switch(mode) {
                case 'sprint':
                    score = horse.stats.speed * 2 + horse.stats.power;
                    break;
                case 'endurance':
                    score = horse.stats.stamina * 2 + horse.stats.recovery;
                    break;
                case 'precision':
                    score = horse.stats.precision * 2 + horse.stats.temperament;
                    break;
                case 'grandcup':
                    score = Object.values(horse.stats).reduce((a, b) => a + b, 0);
                    break;
            }

            // Random variance
            score += randomInt(-20, 20);

            // Injury roll
            if (Math.random() < 0.1 - (gameState.ranch.facilities.pasture.injuryReduction / 1000)) {
                horse.injuries++;
                showNotification(`${horse.name} got injured!`);
            }

            // Award prizes
            const coinReward = Math.floor(score / 2);
            const xpReward = Math.floor(score / 5);
            
            gameState.player.coins += coinReward;
            horse.xp += xpReward;

            if (horse.xp >= horse.level * 100) {
                horse.level++;
                horse.xp = 0;
                showNotification(`${horse.name} leveled up!`);
            }

            gameState.competitions.points += Math.floor(score / 10);
            updateRank();

            showNotification(`Competition complete! Score: ${score}, Earned: ${coinReward} coins`);
            updateCurrencyBar();
            saveGame();
        }

        function updateRank() {
            const points = gameState.competitions.points;
            if (points >= 10000) gameState.competitions.rank = 'Grand Elite';
            else if (points >= 5000) gameState.competitions.rank = 'Platinum';
            else if (points >= 2000) gameState.competitions.rank = 'Gold';
            else if (points >= 500) gameState.competitions.rank = 'Silver';
            else gameState.competitions.rank = 'Bronze';
        }

                { id: 2, name: 'Compete in races', progress: 0, goal: 2, reward: { gems: 5 }, completed: false },

        function completeQuest(questType, questId) {
            const quest = gameState.quests[questType].find(q => q.id === questId);
            if (!quest || quest.completed) return;

            quest.completed = true;
            
            for (let key in quest.reward) {
                gameState.player[key] += quest.reward[key];
            }

            showNotification('Quest completed!');
            updateCurrencyBar();
            saveGame();
        }

        // ============= RANCH SYSTEM =============
        function upgradeFacility(facility) {
            const current = gameState.ranch.facilities[facility];
            const cost = (current.level + 1) * 200;

            if (gameState.player.coins < cost) {
                showNotification('Not enough coins!');
                return;
            }

            gameState.player.coins -= cost;
            current.level++;

            // Apply bonuses
            switch(facility) {
                case 'stable':
                    current.capacity = 10 + current.level * 5;
                    break;
                case 'trainingRing':
                    current.bonus = current.level * 5;
                    break;
                case 'pasture':
                    current.injuryReduction = current.level * 10;
                    break;
                case 'dragonRoost':
                    current.energyRegen = current.level * 5;
                    break;
            }

            showNotification(`${facility} upgraded to level ${current.level}!`);
            updateCurrencyBar();
            saveGame();
            renderRanch();
        }

            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    size: Math.random() * 3 + 1,
                    color: `hsl(${Math.random() * 60 + 30}, 100%, 60%)`
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.size *= 0.98;

                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                if (particles.some(p => p.size > 0.1)) {
                    requestAnimationFrame(animate);
                }
            }

            animate();
        }

        // ============= SAVE/LOAD =============
        function saveGame() {
            gameState.lastSave = Date.now();
            localStorage.setItem('starboundEliteEquestrian', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('starboundEliteEquestrian');
            if (saved) {
                const loaded = JSON.parse(saved);
                Object.assign(gameState, loaded);
                return true;
            }
            return false;
        }

        // ============= INITIALIZATION =============
        window.addEventListener('load', () => {
            const loaded = loadGame();
            
            if (loaded && gameState.gameStarted) {
                document.getElementById('mainNav').style.display = 'flex';
                initMainScreens();
                switchScreen('home');
                updateCurrencyBar();
            } else {
                initWelcomeScreen();
            }

            // Auto-save every 60 seconds
            setInterval(saveGame, 60000);

            // Dragon energy regen
            setInterval(() => {
                gameState.dragons.forEach(dragon => {
                    if (dragon.energy < dragon.maxEnergy) {
                        dragon.energy = Math.min(dragon.maxEnergy, dragon.energy + 1 + gameState.ranch.facilities.dragonRoost.energyRegen / 10);
                    }
                });
            }, 60000);
        });
    </script>
</body>
</html>
